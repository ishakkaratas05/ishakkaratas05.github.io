<!DOCTYPE html>
<html lang="tr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Detayı - İshak Karataş</title>
    <meta name="description" content="Proje Detayları, Teknik Mühendislik Analizi ve Vaka Çalışması.">

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Corporate Case Study Styles -->
    <style>
        .detail-standalone-page {
            padding-top: 8.5rem;
            padding-bottom: 6rem;
            min-height: 85vh;
        }

        .detail-card {
            padding: 3.5rem;
            max-width: 980px;
            margin: 0 auto;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .detail-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2.5rem;
            margin-bottom: 2.5rem;
        }

        .detail-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-glow);
            color: var(--accent-primary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.4rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin-bottom: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1.25rem;
            margin-top: 2.25rem;
        }

        .meta-card {
            background: var(--bg-primary);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: var(--transition-normal);
        }

        .meta-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .meta-card-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .meta-card-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
            line-height: 1.4;
        }

        .meta-card-value a {
            color: var(--accent-primary);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition-fast);
        }

        .meta-card-value a:hover {
            opacity: 0.85;
            text-decoration: underline;
        }

        /* Mockup Frame Placeholder */
        .preview-mockup-frame {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            overflow: hidden;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-md);
        }

        .mockup-frame-bar {
            height: 36px;
            background: rgba(15, 23, 42, 0.05);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 0.5rem;
        }

        [data-theme="dark"] .mockup-frame-bar {
            background: rgba(255, 255, 255, 0.03);
        }

        .mockup-dots {
            display: flex;
            gap: 0.4rem;
        }

        .mockup-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ef4444;
        }

        .dot-yellow {
            background: #f59e0b;
        }

        .dot-green {
            background: #10b981;
        }

        .mockup-frame-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .mockup-viewport {
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 70%);
            gap: 1rem;
            color: var(--text-muted);
        }

        .mockup-viewport-icon {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        .section-block {
            margin-bottom: 2.75rem;
        }

        .section-block-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.3px;
        }

        .section-block-title i {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            background: var(--accent-glow);
            color: var(--accent-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .section-block-text {
            color: var(--text-secondary);
            line-height: 1.75;
            font-size: 1.02rem;
            margin-bottom: 0;
        }

        .tech-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 1rem;
        }

        .tech-pill {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.45rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-fast);
        }

        .tech-pill:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: var(--accent-glow);
        }

        .video-container-frame {
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2.5rem;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn-wrap {
            margin-top: 3.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            display: flex;
            justify-content: flex-start;
        }

        .error-state {
            text-align: center;
            padding: 5rem 2rem;
        }

        .error-state i {
            font-size: 3.5rem;
            color: var(--accent-primary);
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .detail-card {
                padding: 1.75rem;
            }

            .detail-standalone-page {
                padding-top: 7rem;
            }

            .mockup-viewport {
                height: 240px;
            }
        }

        /* Mockup Viewport with Screenshots Grid */
        .screenshots-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.75rem;
            width: 100%;
            margin-bottom: 3rem;
            align-items: start;
        }

        .mini-mockup-frame.hidden-screenshot {
            display: none !important;
        }

        .show-more-screenshots-wrapper {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .mini-mockup-frame {
            margin-bottom: 0 !important;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            background: var(--bg-primary);
        }

        .mini-mockup-frame:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-lg);
        }

        /* Mobile Mockup Styles (Samsung Style Infinity-O Display) */
        .mobile-mockup-frame {
            width: 210px;
            height: 420px;
            border-radius: 20px;
            border: 6px solid var(--text-primary);
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            margin: 0 auto;
        }

        .mobile-mockup-frame:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-lg);
        }

        .mobile-punch-hole {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000000;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .mobile-viewport-mini {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
        }

        .mobile-viewport-mini img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            transition: transform 0.3s ease;
        }

        .mobile-mockup-frame:hover .mobile-viewport-mini img {
            transform: scale(1.04);
        }

        .mobile-mockup-frame.hidden-screenshot {
            display: none !important;
        }

        .mobile-mockup-placeholder-frame {
            border-color: rgba(99, 102, 241, 0.35);
            background: rgba(99, 102, 241, 0.02) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: default;
        }

        .mobile-mockup-placeholder-frame:hover {
            transform: none;
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: var(--shadow-md);
        }

        .mobile-mockup-placeholder-frame .mobile-punch-hole {
            background: rgba(99, 102, 241, 0.35);
        }

        .mockup-viewport-mini {
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            display: block;
        }

        .screenshot-img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }

        .mini-mockup-frame:hover .screenshot-img {
            transform: scale(1.03);
        }

        .screenshot-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mini-mockup-frame:hover .screenshot-overlay {
            opacity: 1;
        }

        .screenshot-overlay i {
            color: white;
            font-size: 1.5rem;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .mini-mockup-frame:hover .screenshot-overlay i {
            transform: scale(1);
        }

        /* Lightbox Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            border-radius: 0;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: 300;
            transition: 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .lightbox-close:hover {
            color: var(--accent-primary);
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .lightbox-arrow:hover {
            background: var(--accent-primary);
            transform: translateY(-50%) scale(1.1);
            border-color: var(--accent-primary);
        }

        .lightbox-prev {
            left: 2rem;
        }

        .lightbox-next {
            right: 2rem;
        }

        #lightbox-img {
            transition: opacity 0.15s ease-in-out;
        }

        @media (max-width: 576px) {
            .lightbox-arrow {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .lightbox-prev {
                left: 1rem;
            }

            .lightbox-next {
                right: 1rem;
            }
        }

        /* Project Header Buttons */
        .btn-github-large {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 1.3rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            background: #24292e;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all var(--transition-fast);
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        .btn-github-large:hover {
            background: #2f363d;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-youtube-large {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 1.3rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            background: #ef4444;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all var(--transition-fast);
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        .btn-youtube-large:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Code Editor Mockup Styles (Responsive Dark/Light) */
        .code-editor-description {
            margin-top: 1.75rem;
            margin-bottom: 2.5rem;
            max-width: 900px;
            background: #ffffff;
            color: #24292e;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            font-family: 'Fira Code', Consolas, Monaco, 'Courier New', Courier, monospace;
            box-shadow: var(--shadow-md);
            transition: background var(--transition-normal), border var(--transition-normal);
        }

        .code-editor-header {
            background: #f1f3f5;
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition-normal), border var(--transition-normal);
            justify-content: flex-start;
        }

        .editor-dots {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .editor-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .editor-dot-close {
            background: #ff5f56;
        }

        .editor-dot-minimize {
            background: #ffbd2e;
        }

        .editor-dot-zoom {
            background: #27c93f;
        }

        .editor-tabs {
            display: flex;
            height: 100%;
            align-items: flex-end;
            margin-left: 1.5rem;
        }

        .editor-tab {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top: 2px solid var(--accent-primary);
            padding: 0 1rem;
            height: 30px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-primary);
            font-weight: 600;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            transition: all var(--transition-fast);
        }

        .editor-tab i {
            color: #e34c26;
            font-size: 0.95rem;
        }

        .editor-tab-close {
            color: #959da5;
            font-size: 0.75rem;
            margin-left: 0.5rem;
            cursor: pointer;
        }

        .code-editor-body {
            padding: 1.75rem 2rem;
            font-size: 1.05rem;
            line-height: 1.9;
            display: flex;
            gap: 1.5rem;
        }

        .code-line-numbers {
            color: #a0aec0;
            user-select: none;
            text-align: right;
            border-right: 2px solid var(--border-color);
            padding-right: 1.25rem;
            font-size: 1rem;
            min-width: 28px;
            font-weight: 500;
            transition: border var(--transition-normal);
        }

        .code-content {
            color: #2f3e46;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
            font-weight: 550;
            flex-grow: 1;
        }

        /* Dark Theme overrides */
        [data-theme="dark"] .code-editor-description {
            background: #181818;
            border-color: rgba(255, 255, 255, 0.08);
            color: #d4d4d4;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] .code-editor-header {
            background: #1e1e1e;
            border-bottom-color: #121212;
        }

        [data-theme="dark"] .editor-tab {
            background: #181818;
            border-color: rgba(255, 255, 255, 0.08);
            border-bottom: none;
            color: #d4d4d4;
        }

        [data-theme="dark"] .code-line-numbers {
            color: #5a5a5a;
            border-right-color: rgba(255, 255, 255, 0.08);
        }

        [data-theme="dark"] .code-content {
            color: #e1e1e1;
        }

        /* VS Code Status Bar mockup styling */
        .code-editor-status-bar {
            background: #f1f3f5;
            /* Light mode default */
            color: #333333;
            /* Darker text for prominence */
            height: 28px;
            /* Slightly taller */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            font-size: 0.78rem;
            /* Slightly larger */
            user-select: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 600;
            /* Bold/prominent text */
            border-top: 1px solid var(--border-color);
            transition: all var(--transition-normal);
        }

        .code-editor-status-bar i {
            color: var(--accent-primary);
            /* Pop icon color in light mode */
            font-size: 0.85rem;
        }

        /* Dark Theme Status Bar Override (matches VS Code Dark IDE theme) */
        [data-theme="dark"] .code-editor-status-bar {
            background: #1e1e1e;
            color: #c5c5c5;
            /* Brighter readable text */
            border-top: 1px solid #121212;
        }

        [data-theme="dark"] .code-editor-status-bar i {
            color: #007acc;
            /* VS Code blue icons in dark mode */
        }

        .status-left,
        .status-right {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            opacity: 1;
            /* full visibility */
            transition: opacity var(--transition-fast);
        }

        .status-item:hover {
            opacity: 0.85;
        }

        /* Floating Robot Animation */
        @keyframes robotFloating {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-12px) rotate(3deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .robot-floating-animation {
            animation: robotFloating 3.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.12));
            transition: all var(--transition-normal);
        }

        .robot-floating-animation:hover {
            transform: scale(1.06) translateY(-5px);
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.2));
        }

        /* Responsive Overrides for Code Editor Description */
        @media (max-width: 576px) {
            .code-editor-status-bar {
                height: auto !important;
                flex-direction: column !important;
                gap: 0.5rem !important;
                padding: 0.75rem 1rem !important;
                align-items: flex-start !important;
            }
            .status-left, .status-right {
                flex-wrap: wrap !important;
                gap: 0.75rem !important;
                width: 100% !important;
            }
            .code-editor-body {
                padding: 1rem 0.85rem !important;
                gap: 0.75rem !important;
                font-size: 0.92rem !important;
            }
            .code-line-numbers {
                padding-right: 0.5rem !important;
                min-width: 20px !important;
            }
        }
    </style>
</head>

<body>

    <!-- Bilimsel Kareli Arka Plan & Süzülen Düğümler Ağ Katmanı -->
    <div class="math-grid-bg"></div>
    <canvas id="bg-scientific-canvas" class="bg-scientific-canvas"></canvas>

    <!-- Süzülen Teknoloji İkonları -->
    <div class="floating-tech-icons">

                    <!-- Interface Screenshots (Web) -->

                            <h3 class="section-block-title" style="margin-bottom: 1.5rem;">

                            <div class="screenshots-grid-container">
                                ${project.screenshots.map((ss, idx) => `
                                    <div class="preview-mockup-frame mini-mockup-frame ${idx >= 6 ? 'hidden-screenshot' : ''}" onclick="openLightbox('${ss}')">
                                        <div class="mockup-frame-bar">
                                            <div class="mockup-dots">

                                                <div class="mockup-dot dot-yellow"></div>

                                            <div class="mockup-frame-title">
                                                <i class="fa-solid fa-lock" style="font-size: 0.6rem;"></i> Arayüz #${idx + 1}

                                        <div class="mockup-viewport-mini">

                                ${project.screenshots.length > 6 ? `

                    ` : `

                    <!-- Interface Screenshots (Mobile) -->

        function showAllScreenshots() {
            const hiddenItems = document.querySelectorAll('.mini-mockup-frame.hidden-screenshot');
            hiddenItems.forEach(item => {
                item.classList.remove('hidden-screenshot');
            });
            const wrapper = document.getElementById('show-more-wrapper');
            if (wrapper) {
                wrapper.style.display = 'none';
            }
        }

        function showAllMobileScreenshots() {
            const hiddenItems = document.querySelectorAll('.mobile-mockup-frame.hidden-screenshot');
            hiddenItems.forEach(item => {
                item.classList.remove('hidden-screenshot');
            });
            const wrapper = document.getElementById('show-more-wrapper-mobile');
            if (wrapper) {
                wrapper.style.display = 'none';
            }
        }

        // Screenshot Lightbox Actions
        let activeProjectScreenshots = [];
        let currentLightboxIndex = -1;

        function openLightbox(src) {
            const lightbox = document.getElementById('screenshot-lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            if (!lightbox || !lightboxImg) return;

            currentLightboxIndex = activeProjectScreenshots.indexOf(src);

            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Disable scroll

            toggleLightboxArrows();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('screenshot-lightbox');
            if (!lightbox) return;

            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Restore scroll
        }

        function changeLightboxImage(dir, event) {
            if (event) event.stopPropagation();
            if (activeProjectScreenshots.length <= 1) return;

            currentLightboxIndex = (currentLightboxIndex + dir + activeProjectScreenshots.length) % activeProjectScreenshots.length;
            const newSrc = activeProjectScreenshots[currentLightboxIndex];

            const lightboxImg = document.getElementById('lightbox-img');
            if (lightboxImg) {
                lightboxImg.style.opacity = '0';
                setTimeout(() => {
                    lightboxImg.src = newSrc;
                    lightboxImg.style.opacity = '1';
                }, 150);
            }
        }

        function toggleLightboxArrows() {
            const prevBtn = document.querySelector('.lightbox-prev');
            const nextBtn = document.querySelector('.lightbox-next');
            if (!prevBtn || !nextBtn) return;

            if (activeProjectScreenshots.length <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            }
        }

        // Close lightbox on Escape key & navigate with Arrow Keys
        window.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('screenshot-lightbox');
            if (lightbox && lightbox.classList.contains('active')) {
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    changeLightboxImage(-1);
                } else if (e.key === 'ArrowRight') {
                    changeLightboxImage(1);
                }
            }
        });

        // Trigger dynamic loading
        window.addEventListener('load', loadProjectDetail);
    </script>
